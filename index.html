<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>TODOs List</title>

    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .stats-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
        }
    </style>
</head>

<body>
<div class="container my-4">
    <h2 class="text-center">TODOs List</h2>

    <div class="form-group">
        <label>Title</label>
        <input type="text" class="form-control" id="title" oninput="checkInputs()">
    </div>

    <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="description" rows="3" oninput="checkInputs()"></textarea>
    </div>

    <button id="add" class="btn btn-primary" disabled>Add to list</button>
    <button id="clear" class="btn btn-danger">Clear list</button>

    <div class="my-4">
        <h2>Your Items</h2>

        <table class="table">
            <thead>
                <tr>
                    <th>SNo</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>

        <!-- STATUS SECTION -->
        <div class="stats-box">
            <h5>Status Summary</h5>
            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>Completed Tasks: <span id="completedTasks">0</span></p>
            <p>Pending Tasks: <span id="pendingTasks">0</span></p>
        </div>
    </div>
</div>

<script>
    let editId = null;

    function checkInputs() {
        let title = document.getElementById('title').value.trim();
        let desc = document.getElementById('description').value.trim();
        document.getElementById('add').disabled = (title === "" || desc === "");
    }

    function getItems() {
        return localStorage.getItem('itemsJson')
            ? JSON.parse(localStorage.getItem('itemsJson'))
            : [];
    }

    function saveItems(items) {
        localStorage.setItem('itemsJson', JSON.stringify(items));
    }

    function getAndUpdate() {
        let title = document.getElementById('title').value.trim();
        let desc = document.getElementById('description').value.trim();

        if (!title || !desc) return;

        let items = getItems();

        if (editId !== null) {
            let index = items.findIndex(i => i.id === editId);
            if (index !== -1) {
                items[index].title = title;
                items[index].desc = desc;
            }
            editId = null;
            document.getElementById('add').textContent = "Add to list";
        } else {
            items.push({
                id: Date.now(),
                title,
                desc,
                completed: false
            });
        }

        saveItems(items);
        document.getElementById('title').value = "";
        document.getElementById('description').value = "";
        checkInputs();
        update();
    }

    function update() {
        let items = getItems();
        let tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        let total = items.length;
        let completed = items.filter(i => i.completed).length;
        let pending = total - completed;

        items.forEach((item, index) => {
            let cls = item.completed ? "completed" : "";

            tableBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td class="${cls}">${item.title}</td>
                    <td class="${cls}">${item.desc}</td>
                    <td>
                        <input type="checkbox" ${item.completed ? "checked" : ""} 
                        onclick="toggleComplete(${item.id})">
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editItem(${item.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">Delete</button>
                    </td>
                </tr>
            `;
        });

        // update stats
        document.getElementById("totalTasks").innerText = total;
        document.getElementById("completedTasks").innerText = completed;
        document.getElementById("pendingTasks").innerText = pending;
    }

    function deleteItem(id) {
        let items = getItems();
        items = items.filter(i => i.id !== id);
        saveItems(items);
        update();
    }

    function toggleComplete(id) {
        let items = getItems();
        let i = items.findIndex(x => x.id === id);

        if (i !== -1) {
            items[i].completed = !items[i].completed;
            saveItems(items);
            update();
        }
    }

    function editItem(id) {
        let items = getItems();
        let item = items.find(i => i.id === id);

        if (item) {
            document.getElementById('title').value = item.title;
            document.getElementById('description').value = item.desc;

            editId = id;
            document.getElementById('add').textContent = "Update";
            checkInputs();
        }
    }

    function clearStorage() {
        if (confirm("Clear all tasks?")) {
            localStorage.clear();
            update();
        }
    }

    document.getElementById("add").addEventListener("click", getAndUpdate);
    document.getElementById("clear").addEventListener("click", clearStorage);

    update();
</script>
</body>
</html>
